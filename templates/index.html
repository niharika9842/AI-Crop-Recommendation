<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Recommendation System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            🌱 Smart Crop AI
        </div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>🌱 AI Powered Crop Recommendation</h1>
        <p>Get the Best Crop Recommendation Based on Soil & Weather</p>
    </section>

    <!-- Form -->
    <div class="container">

        <h2>Enter Soil Details</h2>

        <form action="/predict" method="POST">

            <input type="number" name="N" placeholder="Nitrogen (N)" required>

            <input type="number" name="P" placeholder="Phosphorus (P)" required>

            <input type="number" name="K" placeholder="Potassium (K)" required>

            <label>📍 Current Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Detecting location..."
                required
            >

            <input
                type="number"
                step="0.01"
                id="temperature"
                name="temperature"
                placeholder="Temperature (°C)"
                readonly
                required
            >

            <input
                type="number"
                step="0.01"
                id="humidity"
                name="humidity"
                placeholder="Humidity (%)"
                readonly
                required
            >

            <input
                type="number"
                step="0.01"
                name="ph"
                placeholder="Soil pH"
                required
            >

            <input
                type="number"
                step="0.01"
                id="rainfall"
                name="rainfall"
                placeholder="Rainfall (mm)"
                readonly
                required
            >

            <label>🌱 Soil Type</label>

            <select name="soil" required>
                <option value="">Select Soil Type</option>
                <option value="Black Soil">Black Soil</option>
                <option value="Red Soil">Red Soil</option>
                <option value="Alluvial Soil">Alluvial Soil</option>
                <option value="Clay Soil">Clay Soil</option>
                <option value="Sandy Soil">Sandy Soil</option>
            </select>

            <button type="submit">
                🌾 Predict Crop
            </button>

        </form>

    </div>

<script>

window.onload = function () {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            console.log("Latitude:", lat);
            console.log("Longitude:", lon);

            fetch("/weather?lat=" + lat + "&lon=" + lon)

            .then(function(response){

                if(!response.ok){
                    throw new Error("Weather API Error");
                }

                return response.json();

            })

            .then(function(data){

                console.log(data);

                document.getElementById("location").value =
                    data.city || "";

                document.getElementById("temperature").value =
                    data.temperature || "";

                document.getElementById("humidity").value =
                    data.humidity || "";

                document.getElementById("rainfall").value =
                    data.rainfall || "";

            })

            .catch(function(error){

                console.log(error);

                alert("Unable to fetch weather data.");

                let locationBox = document.getElementById("location");

                locationBox.readOnly = false;
                locationBox.placeholder = "Enter your location";
                locationBox.value = "";

            });

        },

        function(error){

            console.log(error);

            alert("Location permission denied.");

            let locationBox = document.getElementById("location");

            locationBox.readOnly = false;
            locationBox.placeholder = "Enter your location";
            locationBox.value = "";

        }

    );

};

</script>

</body>
</html>
